// Rodada 5 (2026-08-10): antes, qualquer e-mail @cobli.co disparava o magic

// nem chama signInWithOtp -- mostra uma mensagem pedindo pra solicitar
// acesso ao gestor. A checagem usa a função RPC email_is_registered()
// (security definer, só devolve true/false) porque, neste ponto, quem está
// clicando ainda não tem sessão -- não dá pra consultar team_members direto
// via RLS normal. Precisa rodar supabase/patch-login-flow.sql no Supabase
// antes desta validação funcionar de verdade.
async function sendMagicLink() {
  const email = document.getElementById("login-email").value.trim();
  const msg = document.getElementById("login-msg");
  if (!email.endsWith("@cobli.co")) {
    msg.textContent = "Use seu e-mail @cobli.co.";
    return;
  }
  msg.textContent = "Verificando cadastro...";
  const { data: isRegistered, error: checkError } = await sb.rpc("email_is_registered", { check_email: email });
  if (checkError) {
    msg.textContent = "Erro ao verificar cadastro: " + checkError.message;
    return;
  }
  if (!isRegistered) {
    msg.textContent = "Esse e-mail ainda não tem acesso. Peça para seu gestor te convidar no painel de Administração.";
    return;
  }
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: DASHBOARD_URL } });
  msg.textContent = error ? ("Erro: " + error.message) : "Link enviado! Confira seu e-mail.";
}

// E-mail + senha: pra gente de fora da Cobli (ou qualquer um, na prática) --
// sem checagem de domínio @cobli.co, porque a única forma de alguém TER uma
// senha é via sendPasswordReset() abaixo, que já valida email_is_registered()
// antes de mandar o link -- então o cadastro continua sendo o gate real, não
// o domínio do e-mail.
async function loginWithPassword() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const msg = document.getElementById("login-msg");
  if (!email || !password) { msg.textContent = "Preencha e-mail e senha."; return; }
  msg.textContent = "Entrando...";
  const { error } = await sb.auth.signInWithPassword({ email, password });
  msg.textContent = error ? ("Erro: " + error.message) : "";
}

// "Esqueceu a senha?" também é o fluxo de PRIMEIRO ACESSO com senha -- não
// existe uma tela separada de "criar senha": o link do Supabase
// (resetPasswordForEmail) funciona igual pra quem nunca teve senha (só usava
// magic link antes) e pra quem já tem senha e esqueceu. Ou seja: ninguém
// precisa ser excluído/recriado no cadastro pra "ganhar" uma senha.
async function sendPasswordReset() {
  const email = document.getElementById("login-email").value.trim();
  const msg = document.getElementById("login-msg");
  if (!email) { msg.textContent = "Digite seu e-mail no campo acima primeiro."; return; }
  msg.textContent = "Verificando cadastro...";
  const { data: isRegistered, error: checkError } = await sb.rpc("email_is_registered", { check_email: email });
  if (checkError) { msg.textContent = "Erro ao verificar cadastro: " + checkError.message; return; }
  if (!isRegistered) {
    msg.textContent = "Esse e-mail ainda não tem acesso. Peça para seu gestor te convidar no painel de Administração.";
    return;
  }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: DASHBOARD_URL });
  msg.textContent = error ? ("Erro: " + error.message) : "Link enviado! Confira seu e-mail pra definir/trocar sua senha.";
}

// filtros. Agora só inicializa a tela uma vez; disparos seguintes só
// atualizam o usuário em memória, sem re-renderizar nada.

    currentUser = session.user;
    if (!appInitialized) {
      appInitialized = true;
      await onLoggedIn();
    }
  } else {
    appInitialized = false;
    document.getElementById("login-screen").style.display = "block";
    document.getElementById("app").style.display = "none";
  }
});

  document.getElementById("who-name").textContent = member ? member.name : currentUser.email;
  document.getElementById("who-role").textContent = member ? labelRole(member.role) : "sem cadastro";

  if (member && (member.role === "gestor_squad" || member.role === "gestor_geral")) {
    document.getElementById("tab-admin").style.display = "block";

  // Rodada 2: filtros client-side por papel. Só RESTRINGEM ainda mais os
  // dados que a RLS já trouxe para este usuário (state.allRows) -- nunca
  // expandem visibilidade, então são seguros de adicionar sem tocar em RLS.

  // gestor_geral: filtros de "Gestor" (squad de um gestor_squad), "Squad" e
  // "Responsável"/"Usuário" (mesmo controle, serve pros dois papéis).
  if (member && (member.role === "gestor_squad" || member.role === "gestor_geral")) {
    document.getElementById("responsavel-filter-wrap").style.display = "block";
  }
  if (member && member.role === "gestor_geral") {
    document.getElementById("squad-filter-wrap").style.display = "block";
    document.getElementById("gestor-filter-wrap").style.display = "block";
    populateSquadOptions();
    await populateGestorOptions();

  // Rodada 3: gestor de squad só pode convidar "colaborador" pra própria
  // squad (não pode criar outro gestor, nem cadastrar gente em outra
  // squad) -- gestor_geral continua sem restrição no formulário.
  applyInviteFormRestrictions(member);

  if (!member) {
    document.getElementById("table-principal-wrap").innerHTML =
      '<div id="empty-state">Seu e-mail ainda não foi cadastrado no time. Peça para um gestor te convidar.</div>';
    return;
  }

// O Supabase (PostgREST) limita cada resposta a um teto de linhas -- "Max
// Rows" no projeto, hoje 1000 -- então buscar `.select("*")` sem mais nada
// SEMPRE corta em 1000, mesmo tendo 1721 tickets. Corrigido buscando em
// páginas de 1000 via `.range()` até a página vir incompleta.
const PAGE_SIZE = 1000;
async function fetchAllPages(buildQuery) {
  let all = [];
  let from = 0;
  while (true) {
    const { data, error } = await buildQuery(from, from + PAGE_SIZE - 1);
    if (error) throw error;
    all = all.concat(data || []);
    if (!data || data.length < PAGE_SIZE) break;
    from += PAGE_SIZE;
  }
  return all;
}

async function loadDashboard() {
  const wrap = document.getElementById("table-principal-wrap");
  wrap.innerHTML = '<div class="muted" style="padding:20px">Carregando...</div>';

  try {
    state.allRows = await fetchAllPages((from, to) =>
      sb.from("v_dashboard").select("*").order("createdate", { ascending: true }).range(from, to)
    );
  } catch (error) {
    wrap.innerHTML = '<div id="empty-state">Erro ao carregar: ' + escapeHtml(error.message) + "</div>";
    return;
  }

  // Rodada 9 (2026-08-12): checkbox "Agendado" -- ticket com
  // ticket_priority_ack já existente ANTES desta carga não aparece mais na
  // tabela dali em diante (marcação permanente, não snooze de 1 dia -- ver
  // supabase/patch-ticket-priority-ack.sql). Os marcados NESTA sessão
  // (state.justAcked) continuam em allRows -- só ficam visualmente
  // "apagados" até o próximo reload (ver renderTable/onAckTicket).
  state.justAcked = new Set();
  try {
    const ackedRows = await fetchAllPages((from, to) =>
      sb.from("ticket_priority_ack").select("ticket_id").range(from, to)
    );
    const ackedAtLoad = new Set(ackedRows.map(r => r.ticket_id));
    state.allRows = state.allRows.filter(r => !ackedAtLoad.has(r.ticket_id));
  } catch (error) {
    // Tabela pode ainda não existir se supabase/patch-ticket-priority-ack.sql
    // não tiver rodado ainda -- não trava o resto do dashboard por isso.
    console.error("Erro ao carregar ticket_priority_ack (o patch SQL já foi rodado?):", error.message);
  }

  state.productsByTicket = await loadProductsFor(state.allRows.map(d => d.ticket_id));
  populateResponsavelOptions();

  renderAll();
}

// (botão + painel de checkboxes), ver .msel* no CSS. `MSEL_STATE_KEY` mapeia
// o nome curto usado nos ids/onclick pra chave real em `state`.
const MSEL_STATE_KEY = { gestor: "gestorFilter", squad: "squadFilter", responsavel: "responsavelFilter" };
const MSEL_ALL_LABEL = { gestor: "Todos os gestores", squad: "Todas as squads", responsavel: "Todos os responsáveis" };

  { value: "onboarding", label: "Onboarding" },

];

function toggleMsel(name) {
  const panel = document.getElementById(name + "-filter-panel");
  const isOpen = panel.classList.contains("open");
  document.querySelectorAll(".msel-panel.open").forEach(p => p.classList.remove("open"));
  if (!isOpen) panel.classList.add("open");
}
document.addEventListener("click", (e) => {
  if (!e.target.closest(".msel")) {
    document.querySelectorAll(".msel-panel.open").forEach(p => p.classList.remove("open"));
  }
});

function renderMselOptions(name, options) {
  const panel = document.getElementById(name + "-filter-panel");
  const key = MSEL_STATE_KEY[name];
  const selected = state[key];
  panel.innerHTML = options.map(o => `
    <label class="msel-option">
      <input type="checkbox" value="${escapeHtml(o.value)}" ${selected.includes(o.value) ? "checked" : ""} onchange="toggleMselValue('${name}', this.value)" />
      <span>${escapeHtml(o.label)}</span>
    </label>`).join("");
  updateMselButtonLabel(name, options);
}

function updateMselButtonLabel(name, options) {
  const wrap = document.getElementById(name + "-filter-wrap");
  const label = wrap && wrap.querySelector(".msel-btn-text");
  if (!label) return;
  const key = MSEL_STATE_KEY[name];
  const selected = state[key];
  if (!selected.length) { label.textContent = MSEL_ALL_LABEL[name]; return; }
  if (selected.length === 1) {
    const opt = options.find(o => o.value === selected[0]);
    label.textContent = opt ? opt.label : selected[0];
    return;
  }
  label.textContent = selected.length + " selecionados";
}

function toggleMselValue(name, value) {
  const key = MSEL_STATE_KEY[name];
  const arr = state[key];
  const idx = arr.indexOf(value);
  if (idx === -1) arr.push(value); else arr.splice(idx, 1);
  const options = Array.from(document.querySelectorAll(`#${name}-filter-panel .msel-option`)).map(l => ({
    value: l.querySelector("input").value, label: l.querySelector("span").textContent,
  }));
  updateMselButtonLabel(name, options);
  renderAll();
}

function populateSquadOptions() {
  renderMselOptions("squad", SQUAD_FILTER_OPTIONS);
}

function populateResponsavelOptions() {
  const wrap = document.getElementById("responsavel-filter-wrap");
  if (wrap.style.display === "none") return; // papel atual não usa esse filtro
  const names = Array.from(new Set(state.allRows.map(r => r.owner_name).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "pt-BR"));
  renderMselOptions("responsavel", names.map(n => ({ value: n, label: n })));
}

}

function applyFilters() {
  let rows = state.allRows;
  if (state.squadFilter.length) {
    rows = rows.filter(r => state.squadFilter.includes(r.owner_squad || "sem_squad"));
  }
  if (state.gestorFilter.length) {
    rows = rows.filter(r => state.gestorFilter.includes(r.owner_squad || "sem_squad"));
  }
  if (state.responsavelFilter.length) {
    rows = rows.filter(r => state.responsavelFilter.includes(r.owner_name));
  }
  const squadFiltered = rows;
  if (state.riskFilterActive) {
    rows = rows.filter(r => r.mrr_status === "em_risco");
  }
  // Rodada 3: busca unificada -- nome do cliente/empresa, ticket_id,
  // company_id e grupo econômico (deal_id ainda não está disponível na
  // nossa sincronização -- ver nota no doc do projeto). Aplicada depois do
  // filtro de risco, igual às outras: só restringe o que já está na tela.
  const q = state.searchQuery.trim().toLowerCase();
  if (q) {
    rows = rows.filter(r => {
      const haystack = [
        r.display_name, r.subject_raw, r.company_name, r.ticket_id,
        r.company_id, r.id_grupo_economico,
      ].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(q);
    });
  }

  // ---------------------------------------------------------------------
  // Rodada 9 (2026-08-12): filtros de Prioridade hierárquicos. Só afetam a
  // tabela de Tickets (displayRows) -- NUNCA os KPIs/distribuição
  // (squadFiltered, já capturado acima). Ver design combinado com o Luiz
  // (histórico completo no doc do projeto, seção 5) -- "Design final a
  // implementar".
  // ---------------------------------------------------------------------
  if (state.priorityCategory === "completude") {
    // Filtro OBRIGATÓRIO, sempre aplicado nesta categoria (não é opcional):
    // só entram tickets com completude_dentro_do_prazo = true. Tickets com
    // prazo já vencido são EXCLUÍDOS inteiramente -- regra de negócio
    // confirmada pelo Luiz ("se já passou de 60 dias mesmo que eu faça não
    // contabiliza, então não precisa mostrar nas prioridades"). NÃO existe
    // opção "Vencido" nas sub-opções (removida a pedido dele).
    rows = rows.filter(r => r.completude_qtd_falta != null && r.completude_dentro_do_prazo === true);
    if (state.priorityCompletudeFaixaQtd) {
      rows = rows.filter(r => inFaixaQtdFalta(r.completude_qtd_falta, state.priorityCompletudeFaixaQtd));
    }
    if (state.priorityCompletudeFaixaDias) {
      rows = rows.filter(r => inFaixaDiasRestantes(diasRestantes(r), state.priorityCompletudeFaixaDias));
    }
  } else if (state.priorityCategory === "basic_value") {
    // Basic Value NÃO tem corte de prazo/expiração -- "o basic vale não tem
    // expiração pode trazer todos" (confirmado pelo Luiz). Traz todas as
    // empresas elegíveis (dado não-nulo nesta categoria).
    rows = rows.filter(r => r.completude_qtd_falta_nota_3 != null);
    // Percentis de MRR calculados sobre o conjunto elegível da categoria
    // (antes do sub-filtro de quantidade, pra não mover o "chão" da
    // comparação conforme a faixa de quantidade escolhida) -- ver
    // computeMrrPercentiles(). Simplificação assumida: calculado sobre
    // linhas de TICKET (não deduplicado por empresa) -- uma empresa com
    // vários tickets abertos entra várias vezes na amostra.
    const mrrPercentiles = computeMrrPercentiles(rows);
    if (state.priorityBVFaixaQtd) {
      rows = rows.filter(r => inFaixaQtdNota3(r.completude_qtd_falta_nota_3, state.priorityBVFaixaQtd));
    }
    if (state.priorityBVFaixaMrr && state.priorityBVFaixaMrr !== "todos") {
      rows = rows.filter(r => passesMrrFilter(r.mrr, state.priorityBVFaixaMrr, mrrPercentiles));
    }
  }

  // Rodada 3: ordenação clicável. "basic_value" ordena pela nota de
  // instalação -- é o que importa mais pra squad, não pelo Basic Value geral
  // (a pedido do Luiz) -- com o score geral como critério de desempate.
  // Rodada 6 (2026-08-11): adicionado "mrr" como terceira coluna ordenável.
  // Rodada 8 (2026-08-11): a nota agora é completude_nota_instalacao
  // (recalculada do zero a partir da Completude de Instalação, mesma % de
  // qtd_instalada/qtd_completude), substituindo instalation_completeness_grade
  // (Databricks) -- ver basicValueCellHtml e
  // queries/query-completude-instalacao-sync.sql.
  // Rodada 9 (2026-08-12): quando um filtro de Prioridade está ativo E o
  // usuário ainda não clicou manualmente numa coluna pra ordenar
  // (state.sortKey === null), aplica a ordenação padrão de cada categoria
  // (mais urgente primeiro) -- clicar numa coluna sempre tem prioridade sobre
  // esse padrão.
  if (state.sortKey) {
    const dir = state.sortDir;
    const key = state.sortKey;
    // Rodada 15 (2026-08-27): ordenação estendida pra todas as colunas
    // (antes só dias_aberto/basic_value/mrr) -- pedido do Luiz ("deixar as
    // colunas todas com opção de ordenação"). Colunas de texto usam
    // localeCompare; numéricas/booleanas continuam com o mesmo tratamento de
    // "sem dado sempre por último" de antes.
    rows = rows.slice().sort((a, b) => {
      let av, bv;
      if (key === "dias_aberto") { av = a.dias_aberto; bv = b.dias_aberto; }
      else if (key === "mrr") { av = a.mrr; bv = b.mrr; }
      else if (key === "basic_value") { av = a.completude_nota_instalacao; bv = b.completude_nota_instalacao; }
      else if (key === "completude") { av = a.completude_pct; bv = b.completude_pct; }
      else if (key === "cliente") { av = a.display_name || a.subject_raw || a.ticket_id; bv = b.display_name || b.subject_raw || b.ticket_id; }
      else if (key === "squad") { av = labelSquad(a.owner_squad || "sem_squad"); bv = labelSquad(b.owner_squad || "sem_squad"); }
      else if (key === "classe") { av = a.classe_instalacao; bv = b.classe_instalacao; }
      else if (key === "produtos") { av = (state.productsByTicket[a.ticket_id] || []).length; bv = (state.productsByTicket[b.ticket_id] || []).length; }
      else if (key === "tratativa") { av = a.status_tratativa || a.observacao; bv = b.status_tratativa || b.observacao; }
      const aNull = av == null || av === "", bNull = bv == null || bv === "";
      if (aNull && bNull) {
        if (key !== "basic_value") return 0;
        return dir * ((a.basic_value_score || 0) - (b.basic_value_score || 0));
      }
      if (aNull) return 1;  // sem dado sempre por último, em qualquer direção
      if (bNull) return -1;
      if (typeof av === "string" || typeof bv === "string") {
        const cmp = String(av).localeCompare(String(bv), "pt-BR");
        if (cmp !== 0) return dir * cmp;
        return 0;
      }
      if (av !== bv) return dir * (av - bv);
      if (key === "basic_value") return dir * ((a.basic_value_score || 0) - (b.basic_value_score || 0));
      return 0;
    });
  } else if (state.priorityCategory === "completude") {
    // "Dias pra vencer o prazo": padrão ordena por dias restantes crescente
    // (mais perto de vencer primeiro).
    rows = rows.slice().sort((a, b) => {
      const da = diasRestantes(a), db = diasRestantes(b);
      if (da == null && db == null) return 0;
      if (da == null) return 1;
      if (db == null) return -1;
      return da - db;
    });
  } else if (state.priorityCategory === "basic_value") {
    // "MRR": padrão ordena por MRR decrescente.
    rows = rows.slice().sort((a, b) => (Number(b.mrr) || 0) - (Number(a.mrr) || 0));
  }
  return { squadFiltered, displayRows: rows };
}
