<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Basic Value — Acompanhamento de Instalações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    /* Paleta oficial Cobli */
    --indigo:      #07074E;
    --royal:       #001BB8;
    --green:       #0FFDC9;
    --paper:       #F5F7FA;
    --paper-2:     #ECEFF5;
    --ink:         #07074E;
    --ink-soft:    #4A4F73;
    --ink-mute:    #8288A3;
    --line:        rgba(7,7,78,0.10);
    --royal-soft:  rgba(0,27,184,0.07);
    --royal-soft-2: rgba(0,27,184,0.14);
    --green-soft:  rgba(15,253,201,0.20);
    --risk:        #C7362C;
    --risk-soft:   rgba(199,54,44,0.10);
    --warn:        #B7791F;
    --warn-soft:   rgba(183,121,31,0.12);
    --ok-text:     #0E7D5F;
    --ok-soft:     rgba(15,253,201,0.22);
    /* Rampa ordinal de 1 hue só (verde), validada com o script do skill de
       dataviz (node validate_palette.js ... --ordinal -- todos os checks
       passam: monotonicidade de luminância, contraste do degrau mais claro
       e hue único). Usada SÓ no gráfico de evolução (aba "Evolução B.V.") --
       ali vários graus aparecem lado a lado na mesma visualização, onde a
       distinguibilidade entre cores adjacentes importa de verdade. Os badges
       existentes (.grade-pill, aprovados na Rodada 2) continuam com suas
       cores de status (risco/aviso/ok) -- lá cada grau aparece isolado, não
       em comparação direta lado a lado, então o rigor de paleta categórica
       não se aplica do mesmo jeito. */
    --bv-ramp-0: #39c692;
    --bv-ramp-1: #30a67b;
    --bv-ramp-2: #278663;
    --bv-ramp-3: #1e674c;
    --bv-ramp-4: #154735;
    --bv-ramp-x: #ABB0C4;
    --radius-card: 14px;
    --radius-pill: 999px;
    --shadow-card: 0 1px 2px rgba(7,7,78,0.05), 0 8px 24px rgba(7,7,78,0.07);
    font-family: "Geist", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: inherit; -webkit-font-smoothing: antialiased; }

  header {
    height: 56px;
    padding: 0 28px;
    background: #fff;
    border-bottom: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 20;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand svg { width: 26px; height: 29px; flex-shrink: 0; }
  .brand-text h1 { font-size: 16px; margin: 0; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .brand-text p { font-size: 12px; margin: 2px 0 0; color: var(--ink-mute); }
  .who { display: flex; align-items: center; gap: 10px; }
  .who-name { font-size: 13px; font-weight: 600; color: var(--ink); }
  .role-badge {
    font-size: 11px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-pill);
    background: var(--royal-soft-2); color: var(--royal); text-transform: uppercase; letter-spacing: 0.02em;
  }

  html, body { height: 100%; }
  #app { display: flex; flex-direction: column; height: 100vh; }
  main {
    padding: 10px 28px 16px; max-width: 1520px; width: 100%; margin: 0 auto;
    display: flex; flex-direction: column; flex: 1; min-height: 0;
  }

  /* Indicadores + toolbar: altura natural, não rolam -- só o painel abaixo rola. */
  .sticky-zone { flex-shrink: 0; }

  /* Os painéis (Tickets / Evolução B.V. / Administração -- "Atendimentos
     múltiplos" removido em 2026-08-12, ver switchTab()) ocupam o espaço
     restante e rolam por dentro -- a página/tela em si não rola. */
  #panel-principal, #panel-evolucao, #panel-admin {
    flex: 1; min-height: 0; flex-direction: column; overflow-y: auto; overflow-x: auto;
  }
  #panel-principal, #panel-evolucao {
    border: 1px solid var(--line); border-radius: 12px; background: #fff;
  }

  #login-screen {
    max-width: 380px; margin: 100px auto; padding: 32px; background: #fff;
    border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow-card);
  }
  #login-screen h2 { margin: 0 0 6px; font-size: 18px; color: var(--ink); }
  #login-screen input {
    width: 100%; padding: 11px 12px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); margin-bottom: 12px; font-family: inherit; font-size: 14px;
  }
  #login-screen input:focus { outline: none; border-color: var(--royal); }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: none; background: var(--royal); color: #fff;
    cursor: pointer; font-weight: 600; font-size: 13px; font-family: inherit; transition: opacity .15s;
  }
  .btn:hover { opacity: 0.88; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.ghost:hover { background: var(--paper-2); opacity: 1; }
  #login-msg { font-size: 13px; color: var(--ink-mute); margin-top: 8px; }

  /* KPI cards -- compactos de propósito: precisam sobrar espaço vertical
     pra tabela, já que ficam sempre visíveis (sticky) enquanto rola. */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
  .kpi-card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow-card); padding: 8px 12px 8px 16px; display: flex; flex-direction: column; gap: 1px;
    position: relative; overflow: hidden;
  }
  /* Rodada 15 (2026-08-27): linha fina lateral pra separar visualmente os
     cards (pedido do Luiz, foto 3 -- "coloca uma linhazinha na lateral
     deles"). Mesmo tratamento aplicado aos blocos da sidebar (.sidebar-block). */
  .kpi-card::before {
    content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px;
    border-radius: 0 2px 2px 0; background: var(--royal-soft-2);
  }
  .kpi-card.clickable { cursor: pointer; transition: transform .12s, box-shadow .12s; }
  .kpi-card.clickable:hover { transform: translateY(-1px); box-shadow: 0 4px 8px rgba(7,7,78,0.06), 0 14px 28px rgba(7,7,78,0.10); }
  .kpi-card.active { border-color: var(--risk); box-shadow: 0 0 0 2px rgba(199,54,44,0.15); }
  .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi-icon { width: 18px; height: 18px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .kpi-icon svg { width: 10px; height: 10px; }
  .kpi-icon.royal { background: var(--royal-soft-2); color: var(--royal); }
  .kpi-icon.risk { background: var(--risk-soft); color: var(--risk); }
  .kpi-icon.green { background: var(--green-soft); color: var(--ok-text); }
  .kpi-icon.warn { background: var(--warn-soft); color: var(--warn); }
  .kpi-number { font-size: 20px; font-weight: 700; color: var(--ink); line-height: 1.1; letter-spacing: -0.02em; }
  .kpi-number.risk { color: var(--risk); }
  .kpi-label { font-size: 10.5px; color: var(--ink-mute); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
  .kpi-hint { font-size: 10.5px; color: var(--ink-mute); }

  /* Toolbar */
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs { display: flex; gap: 2px; }
  .tab { padding: 9px 16px; border-radius: 10px 10px 0 0; cursor: pointer; color: var(--ink-mute); font-size: 13px; font-weight: 600; border: 1px solid transparent; }
  .tab.active { background: #fff; color: var(--ink); border-color: var(--line); border-bottom-color: #fff; }
  .spacer { flex: 1; }
  select, input[type=text] {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    font-family: inherit; font-size: 13px;
  }
  .sync-badge {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-soft);
    background: var(--paper-2); padding: 5px 12px; border-radius: var(--radius-pill); border: 1px solid var(--line);
    font-weight: 500;
  }
  .sync-badge svg { width: 12px; height: 12px; }
  .filter-chip {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600;
    background: var(--risk-soft); color: var(--risk); padding: 5px 10px 5px 12px; border-radius: var(--radius-pill);
    cursor: pointer; border: 1px solid rgba(199,54,44,0.25);
  }
  .filter-chip span.x { font-size: 14px; line-height: 1; }

  table { width: 100%; border-collapse: collapse; background: #fff; }
  th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
  /* Rodada 12 (2026-08-12): removido `text-transform: uppercase` -- pedido do
     Luiz ("ajusta esses nomes deixa só a primeira letra maiuscula para não
     quebrar linha"). Texto em CAIXA ALTA ocupa mais largura que o mesmo texto
     em caixa normal no mesmo tamanho de fonte -- era isso que fazia
     cabeçalhos como "Aberto há" ("ABERTO HÁ") ou "Compl. instalação"
     ("COMPL. INSTALAÇÃO") quebrarem em 2 linhas em colunas estreitas. O texto
     de origem (`<th>Aberto há</th>` etc.) já estava em caixa normal -- só o
     CSS forçava maiúsculas. `white-space: nowrap` adicionado como garantia
     extra (mesma lógica do fix de `.bv-cell .bv-row`): na pior das hipóteses
     a tabela ganha scroll horizontal em vez de cabeçalho quebrado. */
  th { color: var(--ink-mute); font-weight: 600; font-size: 11.5px; letter-spacing: 0.01em; white-space: nowrap; background: var(--paper-2); position: sticky; top: 0; z-index: 5; }
  tbody tr:nth-child(even) td { background: rgba(7,7,78,0.012); }
  tbody tr:hover td { background: var(--royal-soft); }
  tbody tr:last-child td { border-bottom: none; }

  /* Rodada 11 (2026-08-12): truncar nome longo com "..." -- pedido do Luiz
     pra ganhar espaço horizontal ("Cattani Transporte..." em vez do nome
     inteiro). Tooltip (title) mantém o nome completo ao passar o mouse. */
  .client-name {
    font-weight: 600; color: var(--ink); font-size: 13.5px;
    max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .meta-line { font-size: 12px; color: var(--ink-mute); margin-top: 2px; }
  .meta-line a { color: var(--royal); text-decoration: none; font-weight: 600; }
  .meta-line a:hover { text-decoration: underline; }

  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: var(--radius-pill); font-size: 11px; font-weight: 700; white-space: nowrap; }
  .badge.ok { background: var(--ok-soft); color: var(--ok-text); }
  .badge.risk { background: var(--risk-soft); color: var(--risk); }
  /* Rodada 15 (2026-08-27): badges de risco/ok viraram só ícone (pedido do
     Luiz -- "coloca só um ícone de alerta", "check verde") em vez de texto,
     tanto no Basic Value Geral quanto na Completude de Instalação. Motivo
     textual continua disponível no title (tooltip). */
  .badge.icon-only { padding: 3px 6px; }
  .badge svg { width: 12px; height: 12px; display: block; }
  .badge.stage { background: var(--royal-soft-2); color: var(--royal); }
  .badge.squad { background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); }
  .badge.squad.onboarding { background: rgba(0,27,184,0.08); color: var(--royal); }
  .badge.squad.smb { background: rgba(183,121,31,0.10); color: var(--warn); }
  .badge.squad.icp { background: var(--green-soft); color: var(--ok-text); }
  .muted { color: var(--ink-mute); }

  .products-wrap { display: flex; flex-wrap: wrap; gap: 4px; max-width: 200px; }
  .chip { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); white-space: nowrap; }
  .chip.empty { background: transparent; color: var(--ink-mute); font-weight: 500; font-style: italic; border-style: dashed; }
  /* Rastreador (telemetria) = a contagem real de ESNs do ticket -- é o "produto
     base" da instalação, distinto dos acessórios (câmera/trava/chaveiro) que
     vêm de propriedades HubSpot separadas. Destacado com a cor royal pra não
     se confundir com os chips de acessório. */
  .chip.chip-core { background: var(--royal-soft-2); color: var(--royal); border-color: rgba(0,27,184,0.2); font-weight: 700; }

  /* Card de distribuição por Basic Value de Instalação -- uma linha só,
     compacta de propósito (mesma lógica dos KPIs: sobrar espaço pra tabela).
     Rodada 2 (2026-08-10): trocado de "bolinha + texto" pra badges/pills,
     mesmo padrão visual do resto do dashboard (.badge), com fundo bem suave
     de cada cor em vez de um ponto colorido solto. */
  .grade-title { font-size: 10.5px; color: var(--ink-mute); font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; white-space: nowrap; }
  .grade-pill {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
    border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .grade-pill b { font-size: 13.5px; font-weight: 700; }
  .grade-pill .pct { font-size: 11px; font-weight: 600; opacity: 0.72; }
  /* Correção (2026-08-12): revertido pra cor de STATUS (risco/aviso/ok),
     como estava antes da Rodada 6 -- CSS exato recuperado do commit
     01c179608ade3b12ca7c414ea4a86751ca82a09d (imediatamente antes da Rodada
     6). O Luiz esclareceu que o pedido da Rodada 4/6 era o INVERSO do que
     tinha sido implementado: este card (.grade-pill) deveria continuar com
     cor de status, e é a paleta de status que deveria ir pro gráfico de
     Evolução B.V. (ver EVO_RAMP), não o contrário. */
  .grade-pill.g4 { background: var(--ok-soft); color: var(--ok-text); }
  .grade-pill.g3 { background: rgba(76,156,134,0.16); color: #3F7D69; }
  .grade-pill.g2 { background: var(--warn-soft); color: var(--warn); }
  .grade-pill.g1 { background: rgba(199,122,58,0.16); color: #A3652E; }
  .grade-pill.g0 { background: var(--risk-soft); color: var(--risk); }
  .grade-pill.gx { background: var(--paper-2); color: var(--ink-mute); }
  .grade-card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow-card);
    padding: 9px 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }

  /* Rodada 12 (2026-08-12): `white-space: nowrap` adicionado -- pedido do
     Luiz ("ajustar a coluna para não quebrar em 3 linhas o completude").
     Causa raiz: a linha "67% | +3 para 80%" é texto normal dentro de um flex
     item -- sem isso, o texto quebra dentro do próprio .bv-row quando a
     coluna fica estreita (tabela sem table-layout:fixed, largura decidida
     pelo navegador conforme o conteúdo de todas as colunas), virando 2
     linhas visuais só nessa div + a linha do badge = 3 linhas no total.
     Com nowrap, cada .bv-row nunca quebra -- na pior das hipóteses (viewport
     bem estreito) a TABELA ganha scroll horizontal (`#panel-principal` já
     tem overflow-x:auto), o que é preferível a texto cortado/quebrado dentro
     da célula. */
  .bv-cell .bv-row { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin-bottom: 3px; white-space: nowrap; }
  .bv-cell .bv-row b { color: var(--ink); }
  .bv-cell .mrr-line { font-size: 11.5px; color: var(--ink-mute); }

  .tratativa-cell select, .tratativa-cell textarea { width: 100%; font-size: 12px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); font-family: inherit; }
  .tratativa-cell textarea { margin-top: 6px; min-height: 44px; resize: vertical; }
  .tratativa-cell select:focus, .tratativa-cell textarea:focus { outline: none; border-color: var(--royal); }

  /* Rodada 2 (2026-08-10): tirado o max-width: 780px -- era o motivo do
     painel de Administração parecer "cortado"/mais estreito que o resto do
     app (Tickets/Atendimentos ocupam a largura toda do <main>, até 1520px).
     Agora acompanha a mesma largura disponível. */
  .admin-panel-card { margin: 0 0 20px; padding: 24px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow-card); width: 100%; }
  .admin-panel-card h3 { margin: 0 0 4px; font-size: 15px; color: var(--ink); }
  .admin-panel-card .form-desc { font-size: 12.5px; color: var(--ink-mute); margin: 0 0 16px; }
  .admin-panel-card form { margin-bottom: 28px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
  .admin-panel-card form:last-of-type { border-bottom: none; padding-bottom: 0; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 16px; }
  .form-grid label { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.02em; }
  .form-grid input, .form-grid select { width: 100%; padding: 9px 10px; font-size: 13px; text-transform: none; letter-spacing: normal; font-weight: 400; color: var(--ink); }
  .form-actions { display: flex; justify-content: flex-end; }

  #empty-state { padding: 48px; text-align: center; color: var(--ink-mute); background: #fff; border: 1px solid var(--line); border-radius: var(--radius-card); font-size: 13px; }

  /* Rodada 3: busca unificada de cliente/empresa (aba Tickets).
     Rodada 11 (2026-08-12): removido o `min-width: 240px` daqui -- era da
     época em que a busca vivia na toolbar horizontal (espaço de sobra).
     Desde a Rodada 9 ela mora na sidebar (hoje 222px de área útil interna) --
     esse min-width forçava o input a ficar sempre com 240px, 18px mais largo
     que a sidebar, e isso é EXATAMENTE o que causava tanto o scroll
     horizontal (antes do fix de overflow-x) quanto o corte visual (depois do
     fix, que só trocou "aparece scroll" por "aparece cortado" -- o input
     continuava largo demais, só a barra de rolagem que sumiu). Confirmado
     medindo scrollWidth/clientWidth com Playwright: sem este min-width, o
     input já respeita `.search-wrap input[type=text] { width: 100% }` e cabe
     exatamente nos 222px, sem sobra nenhuma. */
  #search-cliente { min-width: 0; }

  /* Rodada 3: ordenação clicável nas colunas */
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th.sortable .sort-arrow { margin-left: 4px; opacity: 0.55; font-size: 10px; }
  th.sortable.sort-active .sort-arrow { opacity: 1; color: var(--royal); }

  /* Rodada 3: badge de sincronização "desatualizada" (> 2 dias) */
  .sync-badge.stale { background: var(--warn-soft); color: var(--warn); border-color: rgba(183,121,31,0.3); }
  .sync-badge.fresh { background: var(--ok-soft); color: var(--ok-text); border-color: rgba(15,253,201,0.35); }

  /* Rodada 3: campos travados no formulário de convite (gestor de squad) */
  .locked-value { padding: 9px 10px; font-size: 13px; color: var(--ink-soft); background: var(--paper-2); border-radius: 8px; border: 1px solid var(--line); }

  /* Rodada 3: aba "Evolução B.V." */
  .evo-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius-card); box-shadow: var(--shadow-card); padding: 20px 24px; margin: 0 0 16px; }
  .evo-card h3 { margin: 0 0 4px; font-size: 15px; color: var(--ink); }
  .evo-card .form-desc { font-size: 12.5px; color: var(--ink-mute); margin: 0 0 18px; }
  .evo-chart-wrap { position: relative; }
  .evo-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 12px; color: var(--ink-soft); }
  .evo-legend-item { display: inline-flex; align-items: center; gap: 6px; }
  .evo-legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }
  .evo-tooltip {
    position: absolute; background: var(--ink); color: #fff; font-size: 11.5px; padding: 6px 10px;
    border-radius: 6px; pointer-events: none; white-space: nowrap; box-shadow: var(--shadow-card);
    z-index: 30; opacity: 0; transition: opacity .1s; transform: translate(-50%, -100%);
  }
  .evo-tooltip.show { opacity: 1; }
  .evo-table-toggle { font-size: 12px; color: var(--royal); cursor: pointer; text-decoration: underline; margin-top: 10px; display: inline-block; }
  .evo-table-wrap { margin-top: 12px; }
  .evo-empty { padding: 24px; text-align: center; color: var(--ink-mute); font-size: 13px; }
  .evo-controls { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .evo-toggle { display: inline-flex; background: var(--paper-2); border-radius: 999px; padding: 3px; gap: 2px; }
  .evo-toggle button {
    border: none; background: transparent; font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--ink-soft); padding: 6px 14px; border-radius: 999px; cursor: pointer;
  }
  .evo-toggle button.active { background: #fff; color: var(--royal); box-shadow: var(--shadow-card); }
  .evo-range-select {
    font-family: inherit; font-size: 12.5px; color: var(--ink-soft); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; background: #fff; cursor: pointer;
  }

  /* Rodada 6 (2026-08-11): KPIs + distribuição por Basic Value viraram um
     único bloco recolhível -- por decisão do Luiz, começa SEMPRE expandido;
     o toggle só existe pra quem quiser ganhar espaço vertical pra tabela. */
  .kpi-block-header {
    display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none;
    font-size: 11.5px; font-weight: 700; color: var(--ink-mute); text-transform: uppercase;
    letter-spacing: 0.03em; margin-bottom: 6px; padding: 2px 2px;
  }
  .kpi-block-header:hover { color: var(--ink-soft); }
  .kpi-block-toggle { font-size: 11px; transition: transform .12s; display: inline-block; }
  .kpi-block-toggle.collapsed { transform: rotate(-90deg); }

  /* Rodada 6: diferenciação visual squad titular vs. cobertura temporária
     (access_grants) -- só aparece pra quem tem uma squad própria definida
     (colaborador/gestor_squad) e o ticket não é da squad dela. gestor_geral
     não tem "squad titular" (vê tudo por natureza do papel), então nunca
     mostra esse selo. */
  .badge.covering {
    background: transparent; color: var(--ink-mute); border: 1px dashed var(--line);
    font-weight: 600; font-size: 10px; text-transform: uppercase; letter-spacing: 0.02em;
  }

  /* Rodada 6: cards de Convidar/Delegar mais compactos -- observação do Luiz
     de que ficaram "muito largos/feios" em altura na Rodada 2. */
  .admin-panel-card.compact-admin { padding: 16px 20px; }
  .admin-panel-card.compact-admin form { margin-bottom: 14px; padding-bottom: 14px; }
  .admin-panel-card.compact-admin .form-grid { gap: 10px; margin-bottom: 10px; }
  .admin-panel-card.compact-admin h3 { font-size: 13.5px; margin-bottom: 3px; }
  .admin-panel-card.compact-admin .form-desc { font-size: 11.5px; margin-bottom: 10px; }

  /* Rodada 6: ações (editar/excluir) na tabela de Cadastro atual */
  .row-actions { display: flex; gap: 6px; }
  .row-actions button {
    padding: 4px 10px; font-size: 11.5px; border-radius: 6px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-soft); cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .row-actions button:hover { background: var(--paper-2); }
  .row-actions button.danger { color: var(--risk); border-color: rgba(199,54,44,0.3); }
  .row-actions button.danger:hover { background: var(--risk-soft); }

  /* ==========================================================================
     Redesign de layout -- Opção A (sidebar), 2026-08-12.
     Abas + filtros (busca, squad, gestor, responsável, prioridades) saem da
     toolbar horizontal e vão para uma barra lateral esquerda recolhível.
     Os indicadores reais (#kpi-row / #grade-row, MESMA renderização JS de
     sempre) e os painéis de dados continuam no centro/topo do conteúdo
     principal -- só foram realocados, não recriados (o mockup anterior tinha
     esquecido o #grade-row e usado cards de KPI inventados; aqui os
     elementos reais foram só movidos de lugar). */
  .body-shell { display: flex; flex: 1; min-height: 0; gap: 16px; }
  .sidebar {
    width: 204px; flex-shrink: 0; background: #fff; border: 1px solid var(--line);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    display: flex; flex-direction: column; gap: 12px; padding: 12px 10px;
    transition: width .16s ease, padding .16s ease; overflow: hidden;
  }
  .sidebar.collapsed { width: 44px; padding: 14px 6px; gap: 10px; }
  .sidebar.collapsed .sidebar-content { display: none; }
  .sidebar-toggle-row { display: flex; justify-content: flex-end; flex-shrink: 0; }
  .sidebar-toggle-btn {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid var(--line); background: var(--paper-2);
    color: var(--ink-soft); cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .sidebar-toggle-btn:hover { background: var(--paper); }
  /* Rodada 11 (2026-08-12): corrige scroll horizontal indevido na sidebar --
     causa: "overflow-y: auto" sem "overflow-x" explícito faz o navegador
     computar overflow-x como "auto" também (regra do spec de CSS quando um
     eixo é non-visible e o outro não é setado) -- por isso aparecia uma
     barra de rolagem lateral mesmo sem conteúdo realmente mais largo que a
     sidebar. `min-width: 216px` também tirado -- deixava a margem pro
     scrollbar vertical apertada demais. */
  .sidebar-content { display: flex; flex-direction: column; gap: 4px; min-width: 0; overflow-y: auto; overflow-x: hidden; }
  .sidebar-section-title {
    font-size: 10.5px; color: var(--ink-mute); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; margin: 0 0 6px;
  }
  /* Rodada 15 (2026-08-27): linha fina separando os blocos (Navegação /
     Filtros / Prioridades / Sync) -- pedido do Luiz ("tá tudo muito junto"),
     mesma ideia da linha lateral dos KPI cards (.kpi-card::before). */
  .sidebar-block { padding-top: 12px; border-top: 1px solid var(--line); }
  .sidebar-block:first-child { padding-top: 0; border-top: none; }
  .sidebar-tabs { display: flex; flex-direction: column; gap: 2px; }
  /* Reaproveita a classe .tab/.tab.active (usada por switchTab() via
     querySelectorAll(".tab")) -- só o visual muda de "aba horizontal estilo
     pasta" pra "item de menu vertical", sem tocar em JS. */
  .sidebar-tabs .tab {
    border-radius: 8px; padding: 9px 12px; border: 1px solid transparent;
  }
  .sidebar-tabs .tab.active {
    background: var(--royal-soft-2); color: var(--royal); border-color: transparent;
  }
  .sidebar-filters { display: flex; flex-direction: column; gap: 8px; }
  .sidebar-filters select, .sidebar-filters input[type=text] { width: 100%; }
  .sidebar .sync-badge { width: 100%; box-sizing: border-box; justify-content: center; }
  .sidebar .btn.ghost { width: 100%; }

  /* Rodada 15 (2026-08-27): filtros de Gestor/Squad/Responsável viraram
     multi-seleção (pedido do Luiz -- "posso selecionar mais de um se
     quiser"). Componente próprio (botão + painel de checkboxes) em vez de
     <select multiple> nativo, que é feio e de UX ruim. */
  .msel { position: relative; width: 100%; }
  .msel-btn {
    width: 100%; text-align: left; display: flex; align-items: center; justify-content: space-between;
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink);
    font-family: inherit; font-size: 13px; cursor: pointer;
  }
  .msel-btn:hover { background: var(--paper-2); }
  .msel-caret { color: var(--ink-mute); font-size: 10px; margin-left: 6px; }
  .msel-panel {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 30;
    background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow-card);
    padding: 6px; max-height: 220px; overflow-y: auto;
  }
  .msel-panel.open { display: block; }
  .msel-option {
    display: flex; align-items: center; gap: 8px; padding: 6px 6px; border-radius: 6px;
    font-size: 12.5px; color: var(--ink-soft); cursor: pointer;
  }
  .msel-option:hover { background: var(--paper-2); }
  .msel-option input { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }

  /* Filtros de Prioridade (hierárquico) -- Rodada 9 (2026-08-12). Dois
     "pills" mutuamente exclusivos; selecionar um revela 2 grupos de
     sub-opções logo abaixo, na mesma área de filtros (sem navegar pra outra
     tela). */
  .priority-pills { display: flex; flex-direction: column; gap: 6px; }
  .priority-pill {
    width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: #fff; color: var(--ink-soft); font-family: inherit; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .priority-pill:hover { background: var(--paper-2); }
  .priority-pill.active { background: var(--royal-soft-2); color: var(--royal); border-color: rgba(0,27,184,0.25); }
  .priority-suboptions { display: none; flex-direction: column; gap: 10px; margin-top: 8px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .priority-sub-label {
    display: flex; flex-direction: column; gap: 5px; font-size: 11px; font-weight: 600; color: var(--ink-soft);
    text-transform: uppercase; letter-spacing: 0.02em;
  }
  .priority-sub-label select { width: 100%; text-transform: none; letter-spacing: normal; font-weight: 400; }
  .priority-note { font-size: 11.5px; color: var(--ink-mute); line-height: 1.4; }

  /* Checkbox "Agendado" (Rodada 9, 2026-08-12) -- vale pra TODO ticket da
     tabela de Tickets, independente de filtro de prioridade. Ao marcar, a
     linha fica visualmente apagada (permanece assim só durante a sessão
     atual -- da próxima vez que a página carregar, o ticket marcado nem
     aparece mais, ver onAckTicket()/loadDashboard()). */
  .ack-checkbox { width: 17px; height: 17px; cursor: pointer; }
  tr.row-acked td { opacity: 0.42; }
  tr.row-acked .client-name, tr.row-acked td { color: var(--ink-mute) !important; }

  /* Validação de ESN da propriedade (Rodada 9, 2026-08-12) -- chip de aviso
     quando algum ESN esperado da empresa não bate com o "dono atual"
     calculado a partir de pedido_de_entrega (ver
     supabase/patch-esn-validacao.sql). Tooltip (title) traz o detalhe cru
     (ESN + ModeloItem + status), sem mapear nome amigável do modelo ainda. */
  .chip.chip-esn-warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(183,121,31,0.3); font-weight: 700; }

  /* Busca com botão de limpar (Rodada 11, 2026-08-12) -- pedido do Luiz */
  .search-wrap { position: relative; width: 100%; }
  .search-wrap input[type=text] { width: 100%; padding-right: 28px; box-sizing: border-box; }
  .search-clear-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: none; background: transparent; color: var(--ink-mute); font-size: 15px;
    cursor: pointer; line-height: 1; padding: 4px 6px; border-radius: 6px;
  }
  .search-clear-btn:hover { background: var(--paper-2); color: var(--ink-soft); }

  /* Tratativa em popup (Rodada 11, 2026-08-12) -- antes era select+textarea
     inline na célula da tabela; virou popup pra liberar espaço horizontal na
     lista (pedido do Luiz: "a tratativa abrir em popup mesmo, para ganhar
     espaço na lista"). Célula na tabela agora só mostra um indicador
     clicável (ver .tratativa-trigger). */
  .tratativa-trigger { cursor: pointer; }
  .tratativa-trigger:hover { text-decoration: underline; }
  /* Rodada 12: trunca motivo+observação concatenados (podem ficar longos) --
     mesmo padrão de .client-name. Texto completo disponível no title. */
  .tratativa-text { display: inline-block; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(7,7,78,0.35); z-index: 50;
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-card {
    background: #fff; border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    padding: 24px; width: 100%; max-width: 420px; max-height: 85vh; overflow-y: auto;
  }
  .modal-card h3 { margin: 0 0 4px; font-size: 15px; color: var(--ink); }

  /* Rodada 15 (2026-08-27): popup de Tratativa virou popup de Detalhes --
     contatos (pra copiar rápido) + histórico de tratativas -- pedido do Luiz. */
  .contact-block { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
  .contact-line {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: var(--paper);
    border-radius: 8px; font-size: 12.5px;
  }
  .contact-label { color: var(--ink-mute); font-weight: 600; flex-shrink: 0; width: 58px; }
  .contact-value { color: var(--ink); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .copy-btn { padding: 3px 9px !important; font-size: 11px !important; flex-shrink: 0; }
  .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 160px; overflow-y: auto; margin-bottom: 14px; }
  .history-item { padding: 6px 8px; background: var(--paper); border-radius: 8px; }
  .history-date { font-size: 10.5px; color: var(--ink-mute); font-weight: 600; margin-bottom: 2px; }
  .history-text { font-size: 12px; color: var(--ink); }
  .modal-subsection-title {
    font-size: 10.5px; color: var(--ink-mute); font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.03em; margin: 0 0 6px;
  }
  tbody tr.clickable-row { cursor: pointer; }
</style>
</head>
<body>

<div id="login-screen">
  <h2>Basic Value — Acompanhamento</h2>
  <p class="muted" style="font-size:13px; margin: 0 0 16px;">Time Cobli: entre com sua conta Google. Fora da Cobli: entre com e-mail e senha.</p>
  <button class="btn" style="width:100%; margin-bottom:14px" onclick="loginWithGoogle()">Entrar com Google</button>
  <p class="muted" style="font-size:11px; text-align:center; margin:0 0 14px; text-transform:uppercase; letter-spacing:0.03em;">ou</p>
  <input id="login-email" type="email" placeholder="seu e-mail" />
  <input id="login-password" type="password" placeholder="Senha" onkeydown="if(event.key==='Enter') loginWithPassword()" />
  <button class="btn ghost" style="width:100%" onclick="loginWithPassword()">Entrar com e-mail e senha</button>
  <p class="muted" style="font-size:12px; margin-top:10px; text-align:center;">
    <a href="#" onclick="sendPasswordReset(); return false;">Esqueceu a senha? / Primeiro acesso com senha</a>
  </p>
  <div id="login-msg"></div>
</div>
