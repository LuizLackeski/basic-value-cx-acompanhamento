name: Sync to Supabase

# Disparado automaticamente quando a scheduled task do Claude Cowork faz o
# git push de um novo data/latest-sync.json. Também pode ser rodado manualmente
# pela aba "Actions" do GitHub (workflow_dispatch) para reprocessar o último
# arquivo já commitado, sem precisar esperar a próxima sincronização do Claude.
on:
  push:
    paths:
      - "data/latest-sync.json"
  workflow_dispatch: {}

jobs:
  upsert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Upsert into Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/upsert_to_supabase.py
